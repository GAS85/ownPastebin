name: Dev Build
on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        # https://github.com/actions/setup-go/releases/tag/v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.1"
          cache: true # Handles Go's read-only module files correctly; replaces actions/cache

      - name: Download dependencies
        run: go mod download

      # CGO is required for go-sqlite3 (used in all tests via SQLiteStorage).
      - name: Run tests
        run: CGO_ENABLED=1 go test ./... -v -timeout 120s

      - name: Run tests with race detector
        run: CGO_ENABLED=1 go test ./... -race -v -timeout 120s

  # Dev Push
  dev-push:
    runs-on: ubuntu-latest
    #    needs: test

    if: github.ref == 'refs/heads/dev'
    environment: prod

    steps:
      # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set metadata
        id: meta
        run: |
          echo "VCS_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

        # https://github.com/docker/setup-buildx-action/releases/tag/v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

        # https://github.com/docker/login-action/releases/tag/v4.1.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image name
        id: repo
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

        # https://github.com/docker/build-push-action/releases/tag/v7.1.0
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=dev
            VCS_REF=${{ steps.meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          tags: docker.io/${{ steps.repo.outputs.REPO }}:dev
