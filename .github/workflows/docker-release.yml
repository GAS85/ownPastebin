name: Release Build and Push to Dockerhub

on:
  push:
    tags:
      - "v*.*.*" # triggers on tags like v1.0.0

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Release Push
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set metadata
        id: meta
        run: |
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "VCS_REF=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action/releases/tag/v4.0.0
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to Docker Hub
        # https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        # https://github.com/docker/build-push-action/releases/tag/v7.1.0
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            VCS_REF=${{ steps.meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          tags: |
            docker.io/${{ steps.meta.outputs.REPO }}:${{ steps.meta.outputs.VERSION }}
            docker.io/${{ steps.meta.outputs.REPO }}:latest

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: test

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set metadata
        id: meta
        run: |
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "VCS_REF=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Install Packages
        run: |
          sudo apt update && sudo apt install -y openssl minify

      - name: Setup environment
        # Exactly as Dockerfile
        run: |
          # remove files from .dockerignore
          rm -rf \
            .git  \
            .github \
            .gitignore \
            .dockerignore \
            data \
            README.md \
            CHANGELOG.md \
            Dockerfile \
            docker-compose.yml \
            k8s.yml \
            templates/index_full.html \
            *_test.go \
            testutil.go

          wget https://www.w3schools.com/w3css/5/w3.css -O ./static/w3.css
          wget https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css -O ./static/all.min.css

          wget https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/webfonts/fa-solid-900.woff2 -O ./static/fa-solid-900.woff2
          wget https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/webfonts/fa-regular-400.woff2 -O ./static/fa-regular-400.woff2
          wget https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/webfonts/fa-brands-400.woff2 -O ./static/fa-brands-400.woff2

          wget https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js -O ./static/clipboard.min.js
          wget https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.0/mermaid.min.js -O ./static/mermaid.min.js

          sha256sum -c ./static/sha256.sum && rm ./static/sha256.sum

          sed -i 's|../webfonts/||g' ./static/all.min.css

          export InternalHashes=$(grep -oE 'on[a-zA-Z]+="[^"]+"' ./templates/index.html \
            | sed 's/^on[a-zA-Z]*="//; s/"$//' \
            | sort -u \
            | while IFS= read -r line; do \
                hash=$(printf "%s" "$line" | openssl dgst -sha256 -binary | openssl base64); \
                printf "'sha256-%s' " "$hash"; \
            done) && \
            sed -i "s|SHA-HASHES|$InternalHashes|g" ./templates/index.html
          find static/ -type f -name "*.css" ! -name "*.min.*" -exec minify -i "{}" \; && \
          find static/ -type f -name "*.js" ! -name "*.min.*" -exec minify -i "{}" \; && \
          find static/ -type f -name "*.json" ! -name "*.min.*" -exec minify -i "{}" \; && \
          minify -i "static/favicon.svg" && \
          minify -i "templates/swagger_ui.html" && \
          sed -i -e 's/{{\.SSEEnabled}}/747522/g' \
              -e 's/{{\.MaxSize}}/435433/g' \
              -e 's/{{\.MaxTTL}}/399975/g' \
              -e 's/{{\.Version}}/443329/g' \
              -e 's/{{\.BaseURL}}/994342/g' \
              -e 's/{{\.ProtectedPasteEnabled}}/473472/g' "templates/openapi.json.tmpl" && \
          minify --type application/json -i "templates/openapi.json.tmpl" && \
          sed -i -e 's/747522/{{\.SSEEnabled}}/g' \
              -e 's/435433/{{\.MaxSize}}/g' \
              -e 's/399975/{{\.MaxTTL}}/g' \
              -e 's/443329/{{\.Version}}/g' \
              -e 's/994342/{{\.BaseURL}}/g' \
              -e 's/473472/{{\.ProtectedPasteEnabled}}/g' "templates/openapi.json.tmpl"

      - name: Set up Go
        # https://github.com/actions/setup-go/releases/tag/v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go binary
        env:
          VERSION: ${{ github.ref_name }}
          VCS_REF: ${{ github.sha }}
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${VCS_REF}" \
            -o dist/pastebin-${VERSION}-linux-amd64 .

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${VCS_REF}" \
            -o dist/pastebin-${VERSION}-linux-arm64 .

          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${VCS_REF}" \
            -o dist/pastebin-${VERSION}-darwin-amd64 .

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${VCS_REF}" \
            -o dist/pastebin-${VERSION}-darwin-arm64 .

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${VCS_REF}" \
            -o dist/pastebin-${VERSION}-windows-amd64.exe .

          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub Release
        # https://github.com/softprops/action-gh-release/releases/tag/v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            dist/pastebin-*
            dist/SHA256SUMS
