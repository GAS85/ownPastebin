name: Dev Test

permissions:
  contents: read

on:
  workflow_call: # Allow this workflow to be called by other workflows
    inputs: {}
    secrets:
      CODECOV_TOKEN:
        required: true
  push:
    branches-ignore:
      - "dev"
    tags-ignore:
      - "v*.*.*"

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Add PostgreSQL service container
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pastebin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        # https://github.com/actions/setup-go/releases/tag/v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26.1"
          cache: true # Handles Go's read-only module files correctly; replaces actions/cache

      - name: Download dependencies
        run: go mod download

      # Install PostgreSQL client tools (optional, for debugging)
      # - name: Install PostgreSQL client
      #   run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Wait for PostgreSQL to be ready
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      # Verify PostgreSQL is working (optional)
      # - name: Verify PostgreSQL connection
      #   run: |
      #     PGPASSWORD=postgres psql -h localhost -U postgres -d pastebin_test -c "SELECT version();"

      # CGO is required for go-sqlite3 (used in all tests via SQLiteStorage).
      - name: Run tests with coverage
        env:
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/pastebin_test?sslmode=disable
        run: |
          CGO_ENABLED=1
          go test ./... \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage.txt \
            -v \
            -timeout 120s

      - name: Run tests with race detector
        env:
          POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/pastebin_test?sslmode=disable
        run: CGO_ENABLED=1 go test ./... -race -v -timeout 120s

      - name: Upload coverage to Codecov
        # https://github.com/codecov/codecov-action/releases/tag/v6.0.1
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
        with:
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
