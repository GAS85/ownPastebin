name: Dev Test
on:
  push:
  pull_request:

jobs:
  test:
    if: |
      github.ref_type == 'branch' &&
      github.ref_name != 'master' &&
      github.ref_name != 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true # Handles Go's read-only module files correctly; replaces actions/cache

      - name: Download dependencies
        run: go mod download

      # CGO is required for go-sqlite3 (used in all tests via SQLiteStorage).
      - name: Run tests
        run: CGO_ENABLED=1 go test ./... -v -timeout 120s

      - name: Run tests with race detector
        run: CGO_ENABLED=1 go test ./... -race -v -timeout 120s
